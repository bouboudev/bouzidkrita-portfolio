name: Weekly Analytics Report

on:
  workflow_dispatch:
  schedule:
    # Chaque lundi à 07:00 UTC (08:00 hiver / 09:00 été en France)
    - cron: '0 7 * * 1'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run weekly analytics report
        run: node scripts/weekly-analytics-report.mjs
        env:
          UMAMI_SHARE_TOKEN: ${{ secrets.UMAMI_SHARE_TOKEN }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
